; Stage 3: Resident + drivers on the Waveshare ESP32-S3-Touch-LCD-2. Wi-Fi via
; WiFiManager's captive portal, WebSocket to resident.inanimate.tech/devices/<id>,
; status on the LCD; Lua modules screen, lgfx, lvgl, button, touchscreen, imu,
; screens. Lua and LVGL live in the 8 MB PSRAM.
[env:s3-lcd2]
; Arduino core 3.3.12 (ESP-IDF 5.5) from pioarduino's platform, pinned: PlatformIO's own
; espressif32@6.x stops at core 2.0.17 (IDF 4.4), which gets no more fixes. Since 2026-11-02, as the
; C6 builds; one platform for both, so the two no longer reinstall each other's packages.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; ESP32-S3R8: 8 MB octal PSRAM; 16 MB quad flash.
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv
; Core 3.x build fixes for Resident's libraries, and -O2 on each source file (core3.py).
extra_scripts = pre:../../core3.py
; Optimise for speed, not size: LVGL draws in software (~15% faster frames, see README).
custom_optimize = -O2

; Core 3.x compiles C++ as gnu++2b, which covers Resident's std::optional (C++17). Native USB
; only: without the USB flags, Serial stays silent.
build_flags =
    ; Lua allows 200 nested C calls, far more than a 16 KB stack: a recursive pcall or __index panicked
    ; the board at ~30 levels. With this it gets a Lua error, "C stack overflow".
    -DLUAI_MAXCCALLS=25
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Resident's lv_conf.h (from examples/m5stick-demo, as Bench's e-paper S3
    ; build uses it); lv_conf_internal.h stringifies LV_CONF_PATH itself.
    -DLV_CONF_PATH=${platformio.workspace_dir}/../lv_conf.h
    ; luavgl includes bare <lua.h>; Esp32Lua ships its headers in src/lua/.
    -I${platformio.workspace_dir}/libdeps/s3-lcd2/Esp32Lua/src/lua

lib_ldf_mode = deep
; Adafruit's ST7789 library depends on the registry's SD (an AVR one), and LVGL's Arduino SD file
; driver names SD.h under an #if that's off here: deep LDF still builds that SD, which doesn't
; compile on core 3.x. Nothing here uses an SD card.
lib_ignore = SD
lib_deps =
    ; Resident 0.12.0, pinned to the commit Bench's other boards run. It brings
    ; Courier 0.10.0 (Wi-Fi, WebSocket) from the registry.
    ; Resident 0.12.0 plus SandboxConfig::tickIntervalMs, the event drain, and lgfx's pushImage (also
    ; through a palette) and clip rectangle, on Bench's fork (branch lgfx-pushimage) until
    ; inanimate-tech/resident takes them; back to upstream once it does.
    resident=https://github.com/sjunnesson/resident.git#59cd3cf602e95b9caa2c11f7ccfec2f0d84bf931
    ; Courier's WebSocket client: inside ESP-IDF on core 2.x, a managed component since IDF 5 that
    ; core 3.x's prebuilt libraries leave out. Espressif's registry archive, pinned (as on the C6).
    esp_websocket_client=https://components-file.espressif.com/components/espressif/esp_websocket_client/1.8.0/espressif__esp_websocket_client-v1.8.0.zip
    ; The drivers (LCD frame, screen, lgfx target, buttons, touch, IMU), listed explicitly.
    symlink://lib/drivers
    tzapu/WiFiManager@^2.0.17
    bblanchon/ArduinoJson@^7.4.2
    ropg/ezTime@^0.8.3
    fischer-simon/Esp32Lua@^5.4.7
    adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0
    adafruit/Adafruit GFX Library@^1.11.10
    ; screen.qr
    ricmoo/QRCode@^0.0.1
    ; LVGL pinned to the commit the luavgl fork's submodule tracks, as Resident's
    ; m5stick-demo does.
    lvgl=https://github.com/XuNeo/lvgl.git#d18e58d2f2dff763efadef5594ffb2b29d9102b6
    ; luavgl, the Inanimate fork, pinned to its main as of 2026-10-21: Resident 0.12.0
    ; calls its luavgl_app_reset, which older commits lack.
    luavgl=https://github.com/inanimate-tech/luavgl.git#b9824223ddbeee314d580775244d66e7bb1c8c37
    ; Listed explicitly: with symlink:// deps in the list, LDF stops resolving BusIO on its own.
    adafruit/Adafruit BusIO@^1.17.0
