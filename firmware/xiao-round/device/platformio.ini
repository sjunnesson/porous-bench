; Stage 3: Resident + drivers on the Seeed Studio Round Display for XIAO, driven
; by a XIAO ESP32S3. Wi-Fi via WiFiManager's captive portal, WebSocket to
; resident.inanimate.tech/devices/<id>, status on the LCD; Lua modules screen,
; lgfx, lvgl, button, touchscreen, screens. Lua and LVGL live in the 8 MB PSRAM.
[env:xiao-round]
platform = espressif32@6.12.0
; ESP32-S3R8: 8 MB octal PSRAM, 8 MB flash. The board file sets qio_opi, PSRAM
; and native USB (ARDUINO_USB_MODE=1, ARDUINO_USB_CDC_ON_BOOT=1).
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv

; Resident headers use std::optional (C++17).
build_unflags = -std=gnu++11 -Os
build_flags =
    -std=gnu++17
    ; Optimise for speed, not size: LVGL draws in software (~15% faster frames on
    ; the S3-Touch-LCD-2, see firmware/s3-lcd2/README.md).
    -O2
    ; The picture turned 270 degrees clockwise (90 left), as on the Guition: up
    ; is away from a USB-C facing down. 0 puts the USB-C on the right.
    -DSCREEN_ROTATION=270
    ; Resident's lv_conf.h (from examples/m5stick-demo, as Bench's e-paper S3
    ; build uses it); lv_conf_internal.h stringifies LV_CONF_PATH itself.
    -DLV_CONF_PATH=${platformio.workspace_dir}/../lv_conf.h
    ; luavgl includes bare <lua.h>; Esp32Lua ships its headers in src/lua/.
    -I${platformio.workspace_dir}/libdeps/xiao-round/Esp32Lua/src/lua

lib_ldf_mode = deep
lib_deps =
    ; Resident 0.12.0, pinned to the commit Bench's other boards run. It brings
    ; Courier 0.10.0 (Wi-Fi, WebSocket) from the registry.
    ; Resident 0.12.0 plus SandboxConfig::tickIntervalMs and the event drain, on Bench's fork until
    ; inanimate-tech/resident takes it; back to upstream once it does.
    resident=https://github.com/sjunnesson/resident.git#4220083d073b730429370a1ea7bacbddc18684b0
    ; The drivers (LCD frame, screen, lgfx target, buttons, touch), listed explicitly.
    symlink://lib/drivers
    tzapu/WiFiManager@^2.0.17
    bblanchon/ArduinoJson@^7.4.2
    ropg/ezTime@^0.8.3
    fischer-simon/Esp32Lua@^5.4.7
    adafruit/Adafruit GC9A01A@^1.1.0
    adafruit/Adafruit GFX Library@^1.11.10
    ; screen.qr
    ricmoo/QRCode@^0.0.1
    ; LVGL pinned to the commit the luavgl fork's submodule tracks, as Resident's
    ; m5stick-demo does.
    lvgl=https://github.com/XuNeo/lvgl.git#d18e58d2f2dff763efadef5594ffb2b29d9102b6
    ; luavgl, the Inanimate fork, pinned to its main as of 2026-10-21: Resident 0.12.0
    ; calls its luavgl_app_reset, which older commits lack.
    luavgl=https://github.com/inanimate-tech/luavgl.git#b9824223ddbeee314d580775244d66e7bb1c8c37
    ; Listed explicitly: with symlink:// deps in the list, LDF stops resolving BusIO on its own.
    adafruit/Adafruit BusIO@^1.17.0
