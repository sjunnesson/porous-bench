; Stage 3: Resident + drivers on the Seeed Studio Round Display for XIAO, driven
; by a XIAO ESP32S3. Wi-Fi via WiFiManager's captive portal, WebSocket to
; resident.inanimate.tech/devices/<id>, status on the LCD; Lua modules screen,
; lgfx, lvgl, button, touchscreen, screens. Lua and LVGL live in the 8 MB PSRAM.
[env:xiao-round]
; Arduino core 3.3.12 (ESP-IDF 5.5), pioarduino's platform, pinned, as the S3-Touch-LCD-2 and the C6
; build (see firmware/s3-lcd2/README.md); it was espressif32@6.12.0 (core 2.0.17).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
; ESP32-S3R8: 8 MB octal PSRAM, 8 MB flash. The board file sets qio_opi, PSRAM
; and native USB (ARDUINO_USB_MODE=1, ARDUINO_USB_CDC_ON_BOOT=1).
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
; Core 3.x build fixes for Resident's libraries and LVGL, and -O2 on each source file (core3.py).
extra_scripts = pre:../../core3.py
; Optimise for speed, not size: LVGL draws in software (~15% faster frames on the S3-Touch-LCD-2,
; see firmware/s3-lcd2/README.md).
custom_optimize = -O2

; Core 3.x compiles C++ as gnu++2b, which covers Resident's std::optional (C++17).
build_flags =
    ; Lua allows 200 nested C calls, far more than a 16 KB stack: a recursive pcall or __index panicked
    ; the board at ~30 levels. With this it gets a Lua error, "C stack overflow".
    -DLUAI_MAXCCALLS=25
    ; The picture turned 270 degrees clockwise (90 left), as on the Guition: up
    ; is away from a USB-C facing down. 0 puts the USB-C on the right.
    -DSCREEN_ROTATION=270
    ; Resident's lv_conf.h (from examples/m5stick-demo, as Bench's e-paper S3
    ; build uses it); lv_conf_internal.h stringifies LV_CONF_PATH itself.
    -DLV_CONF_PATH=${platformio.workspace_dir}/../lv_conf.h
    ; luavgl includes bare <lua.h>; Esp32Lua ships its headers in src/lua/.
    -I${platformio.workspace_dir}/libdeps/xiao-round/Esp32Lua/src/lua

lib_ldf_mode = deep
; The registry's AVR SD (Adafruit's ST7789 library brings it), which deep LDF builds for LVGL's
; disabled SD driver and which doesn't compile on core 3.x. Nothing here uses an SD card.
lib_ignore = SD
lib_deps =
    ; Resident 0.12.0, pinned to the commit Bench's other boards run. It brings
    ; Courier 0.10.0 (Wi-Fi, WebSocket) from the registry.
    ; Resident 0.12.0 plus SandboxConfig::tickIntervalMs, the event drain, and lgfx's pushImage (also
    ; through a palette) and clip rectangle, on Bench's fork (branch lgfx-pushimage) until
    ; inanimate-tech/resident takes them; back to upstream once it does.
    resident=https://github.com/sjunnesson/resident.git#59cd3cf602e95b9caa2c11f7ccfec2f0d84bf931
    ; Courier's WebSocket client: a managed component since IDF 5, which core 3.x's prebuilt
    ; libraries leave out. Espressif's registry archive, pinned (as on the C6 and S3-LCD-2).
    esp_websocket_client=https://components-file.espressif.com/components/espressif/esp_websocket_client/1.8.0/espressif__esp_websocket_client-v1.8.0.zip
    ; The drivers (LCD frame, screen, lgfx target, buttons, touch), listed explicitly.
    symlink://lib/drivers
    tzapu/WiFiManager@^2.0.17
    bblanchon/ArduinoJson@^7.4.2
    ropg/ezTime@^0.8.3
    fischer-simon/Esp32Lua@^5.4.7
    adafruit/Adafruit GC9A01A@^1.1.0
    adafruit/Adafruit GFX Library@^1.11.10
    ; screen.qr
    ricmoo/QRCode@^0.0.1
    ; LVGL pinned to the commit the luavgl fork's submodule tracks, as Resident's
    ; m5stick-demo does.
    lvgl=https://github.com/XuNeo/lvgl.git#d18e58d2f2dff763efadef5594ffb2b29d9102b6
    ; luavgl, the Inanimate fork, pinned to its main as of 2026-10-21: Resident 0.12.0
    ; calls its luavgl_app_reset, which older commits lack.
    luavgl=https://github.com/inanimate-tech/luavgl.git#b9824223ddbeee314d580775244d66e7bb1c8c37
    ; Listed explicitly: with symlink:// deps in the list, LDF stops resolving BusIO on its own.
    adafruit/Adafruit BusIO@^1.17.0
