; Stage 2: Resident on the Seeed Studio Round Display for XIAO, driven by a XIAO
; ESP32S3. Wi-Fi through WiFiManager's captive portal, WebSocket to
; resident.inanimate.tech/devices/<id>, connection status and the device ID on
; the LCD. No hardware modules yet.
[env:xiao-round]
platform = espressif32@6.12.0
; ESP32-S3R8: 8 MB octal PSRAM, 8 MB flash. The board file sets qio_opi, PSRAM
; and native USB (ARDUINO_USB_MODE=1, ARDUINO_USB_CDC_ON_BOOT=1).
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv

; Resident headers use std::optional (C++17).
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17

lib_ldf_mode = deep
lib_deps =
    ; Resident 0.12.0, pinned to the commit Bench's other boards run. It brings
    ; Courier 0.10.0 (Wi-Fi, WebSocket) from the registry.
    resident=https://github.com/inanimate-tech/resident.git#5ca238cdd750758f8f1defe9fa67d3bcb90758db
    tzapu/WiFiManager@^2.0.17
    bblanchon/ArduinoJson@^7.4.2
    ropg/ezTime@^0.8.3
    fischer-simon/Esp32Lua@^5.4.7
    adafruit/Adafruit GC9A01A@^1.1.0
    adafruit/Adafruit GFX Library@^1.11.10
    adafruit/Adafruit BusIO@^1.17.0
