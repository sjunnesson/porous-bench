; Stage 2: Resident on the Guition ESP32-S3-4848S040. Wi-Fi through
; WiFiManager's captive portal, WebSocket to resident.inanimate.tech/devices/<id>,
; connection status and the device ID on the LCD. No hardware modules yet.
[env:guition-4848]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; ESP32-S3 with 8 MB octal PSRAM and 16 MB quad flash.
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv

; Resident headers use std::optional (C++17). Serial is UART0, through the CH340.
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM

lib_ldf_mode = deep
lib_deps =
    ; Resident 0.12.0, pinned to the commit Bench's other boards run. It brings
    ; Courier 0.10.0 (Wi-Fi, WebSocket) from the registry.
    resident=https://github.com/inanimate-tech/resident.git#5ca238cdd750758f8f1defe9fa67d3bcb90758db
    ; The panel, as stage 3 drives it.
    symlink://../device/lib/panel
    tzapu/WiFiManager@^2.0.17
    bblanchon/ArduinoJson@^7.4.2
    ropg/ezTime@^0.8.3
    fischer-simon/Esp32Lua@^5.4.7
    adafruit/Adafruit GFX Library@^1.11.10
    adafruit/Adafruit BusIO@^1.17.0
