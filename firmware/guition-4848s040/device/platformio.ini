; Stage 3: Resident + drivers on the Guition ESP32-S3-4848S040 (4" 480x480
; ST7701S RGB panel, GT911 touch). Wi-Fi via WiFiManager's captive portal,
; WebSocket to resident.inanimate.tech/devices/<id>, status on the LCD; Lua
; modules screen, lgfx, lvgl, button (no keys: Bench's taps while mirroring),
; touchscreen, screens. Lua, LVGL and both 450 KB frames live in the 8 MB PSRAM.
[env:guition-4848]
; Arduino core 4.0.0-RC1 (ESP-IDF 6.1), pioarduino's platform, pinned; it was espressif32@6.12.0
; (core 2.0.17). Not 3.3.12, as the S3-Touch-LCD-2, the XIAO and the C6 build: IDF 5.5's RGB driver
; loses its place in bounce-buffer mode after one late interrupt (esp-idf#19070, fixed in 6.0/6.1,
; not 5.5), and the picture glitched; without bounce buffers it slid. See README. Move to 4.0.0
; when it's released. The RGB panel driver (lib/panel) builds on all three: stages 1-2 are on 2.0.17.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/61.04.00-RC1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; ESP32-S3 with 8 MB octal PSRAM and 16 MB quad flash (ESPHome: octal, 80 MHz).
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv

; Core 3.x build fixes for Resident's libraries and LVGL, and -O2 on each source file (core3.py).
extra_scripts = pre:../../core3.py
; Optimise for speed, not size: LVGL draws in software (~15% faster frames on the S3-Touch-LCD-2).
custom_optimize = -O2

; A rebuilt Arduino core (pioarduino compiles ESP-IDF's libraries with these: ~5 minutes the first
; time, and it replaces the prebuilt ones in the shared ~/.platformio package until another project
; reinstalls them). Measured on the board, 2026-11-06 (README, "Speed and memory"):
; - Code and constants run from PSRAM, copied there at boot (2.7 MB of it). The octal PSRAM answers
;   a cache miss faster than the quad flash, and LVGL is mostly cache misses: Patterns' Bars 33
;   passes a second to 49.
; - A 64 KB data cache with 64-byte lines (the prebuilt core's: 32 KB, 32 bytes): the panel's scan
;   alone pulls 19 MB a second of frame through it. A full-screen app's strided fills went from
;   20 fps to 30.
; - A 32 KB instruction cache (the prebuilt core's: 16 KB): LVGL-heavy screens another 16-23%.
; The two caches take 48 KB of internal RAM between them.
custom_sdkconfig =
    CONFIG_SPIRAM_XIP_FROM_PSRAM=y
    CONFIG_ESP32S3_DATA_CACHE_64KB=y
    CONFIG_ESP32S3_DATA_CACHE_LINE_64B=y
    CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB=y

; Core 3.x compiles C++ as gnu++2b, which covers Resident's std::optional (C++17). The USB-C goes
; through a CH340 to UART0, so Serial is the UART (the board file's default), not native USB.
build_flags =
    ; Lua allows 200 nested C calls, far more than a 16 KB stack: a recursive pcall or __index panicked
    ; the board at ~30 levels. With this it gets a Lua error, "C stack overflow".
    -DLUAI_MAXCCALLS=25
    -DBOARD_HAS_PSRAM
    ; ArduinoJson 7 keeps a string's length in 2 bytes on 32-bit chips, so an app's code over
    ; 65,535 characters failed to parse ("dropping non-JSON payload: NoMemory"); an iso surface
    ; is ~430 KB. Every library must see the same value, so it's set here, not in a header.
    -DARDUINOJSON_STRING_LENGTH_SIZE=4
    ; The picture turned 270 degrees clockwise (90 left), as ESPHome turns it:
    ; up is away from a USB-C facing down. 0 puts the USB-C on the right.
    -DSCREEN_ROTATION=270
    ; Resident's lv_conf.h (from examples/m5stick-demo, as Bench's other S3
    ; builds use it); lv_conf_internal.h stringifies LV_CONF_PATH itself.
    -DLV_CONF_PATH=${platformio.workspace_dir}/../lv_conf.h
    ; luavgl includes bare <lua.h>; Esp32Lua ships its headers in src/lua/.
    -I${platformio.workspace_dir}/libdeps/guition-4848/Esp32Lua/src/lua

lib_ldf_mode = deep
; The registry's AVR SD, which deep LDF builds for LVGL's disabled SD driver and which doesn't
; compile on core 3.x. Nothing here uses an SD card (the TF slot isn't driven).
lib_ignore = SD
lib_deps =
    ; Resident 0.12.0, pinned to the commit Bench's other boards run. It brings
    ; Courier 0.10.0 (Wi-Fi, WebSocket) from the registry.
    ; Resident 0.12.0 plus SandboxConfig::tickIntervalMs, the event drain, and lgfx's pushImage (also
    ; through a palette) and clip rectangle, on Bench's fork (branch lgfx-pushimage) until
    ; inanimate-tech/resident takes them; back to upstream once it does.
    resident=https://github.com/sjunnesson/resident.git#59cd3cf602e95b9caa2c11f7ccfec2f0d84bf931
    ; Courier's WebSocket client: a managed component since IDF 5, which core 3.x's prebuilt
    ; libraries leave out. Espressif's registry archive, pinned (as on the C6 and the S3 boards).
    esp_websocket_client=https://components-file.espressif.com/components/espressif/esp_websocket_client/1.8.0/espressif__esp_websocket_client-v1.8.0.zip
    ; The panel (ST7701S init and the RGB scan), shared by every stage, and the
    ; drivers (frame, screen, lgfx target, buttons, touch), listed explicitly.
    symlink://lib/panel
    symlink://lib/drivers
    tzapu/WiFiManager@^2.0.17
    bblanchon/ArduinoJson@^7.4.2
    ropg/ezTime@^0.8.3
    fischer-simon/Esp32Lua@^5.4.7
    adafruit/Adafruit GFX Library@^1.11.10
    ; screen.qr
    ricmoo/QRCode@^0.0.1
    ; LVGL pinned to the commit the luavgl fork's submodule tracks, as Resident's
    ; m5stick-demo does.
    lvgl=https://github.com/XuNeo/lvgl.git#d18e58d2f2dff763efadef5594ffb2b29d9102b6
    ; luavgl, the Inanimate fork, pinned to its main as of 2026-10-21: Resident 0.12.0
    ; calls its luavgl_app_reset, which older commits lack.
    luavgl=https://github.com/inanimate-tech/luavgl.git#b9824223ddbeee314d580775244d66e7bb1c8c37
    ; Listed explicitly: with symlink:// deps in the list, LDF stops resolving BusIO on its own.
    adafruit/Adafruit BusIO@^1.17.0
