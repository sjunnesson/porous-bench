; Resident + drivers + LVGL on an ESP32-S3 with PSRAM driving a Waveshare
; 2.13" e-Paper module (8-pin header). Same Lua surface as device/ plus lvgl:
; with Lua and LVGL in PSRAM, the ~70 KB internal-heap limit of the
; PSRAM-less driver board no longer applies.
;
; Target: Espressif ESP32-S3-DevKitC-1-N16R8 (16 MB QIO flash, 8 MB octal
; PSRAM). Plug USB into the port labelled UART (the bridge), not USB.
; Not yet run on hardware: see README.md.
[env:epd213-s3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

; Resident headers use std::optional (C++17).
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    ; The panel and its wiring (see README.md), keys to GND.
    -DEPD_PANEL=4
    -DEPD_BUSY=9
    -DEPD_CS=10
    -DEPD_DIN=11
    -DEPD_CLK=12
    -DEPD_DC=13
    -DEPD_RST=14
    -DBUTTON_A=0
    -DBUTTON_B=4
    ; Resident's lv_conf.h (from examples/m5stick-demo); lv_conf_internal.h
    ; stringifies LV_CONF_PATH itself, so no quotes.
    -DLV_CONF_PATH=${platformio.workspace_dir}/../lv_conf.h
    ; luavgl includes bare <lua.h>; Esp32Lua ships its headers in src/lua/.
    -I${platformio.workspace_dir}/libdeps/epd213-s3/Esp32Lua/src/lua

; Adafruit BusIO #includes SPI.h / Wire.h from headers the chain LDF misses.
lib_ldf_mode = deep
lib_deps =
    ; Resident 0.10.2, pinned to the commit this firmware was built and tested against.
    resident=https://github.com/inanimate-tech/resident.git#ecabf22e529ae6901e0916fa0e62f7703854c729
    ; The drivers are stage 3's, configured by the flags above.
    symlink://../device/lib/drivers
    git+https://github.com/inanimate-tech/courier.git
    tzapu/WiFiManager@^2.0.17
    bblanchon/ArduinoJson@^7.4.2
    ropg/ezTime@^0.8.3
    fischer-simon/Esp32Lua@^5.4.7
    adafruit/Adafruit GFX Library@^1.11.10
    ; screen.qr
    ricmoo/QRCode@^0.0.1
    ; LVGL pinned to the commit the luavgl fork's submodule tracks, as Resident's
    ; m5stick-demo does.
    lvgl=https://github.com/XuNeo/lvgl.git#d18e58d2f2dff763efadef5594ffb2b29d9102b6
    luavgl=https://github.com/inanimate-tech/luavgl.git#main
    ; Listed explicitly: with symlink:// deps in the list, LDF stops resolving BusIO on its own.
    adafruit/Adafruit BusIO@^1.17.0
