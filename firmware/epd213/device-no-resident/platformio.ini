; Stage 1: bring-up, no Resident. Boots, prints chip info, draws a test card
; on the Waveshare 2.13" e-Paper (HINK-E0213A22 = V2, IL3897, 122x250 B/W).
[env:epd213]
platform = espressif32@6.12.0
; Waveshare ESP32 e-Paper Driver Board: ESP32-WROOM-32, 4 MB flash, no PSRAM,
; CP2102 bridge (DTR/RTS auto-reset, no button dance needed).
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Adafruit GFX pulls in BusIO, which #includes SPI.h / Wire.h from headers
; the default chain LDF can't resolve.
lib_ldf_mode = deep
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.10
    adafruit/Adafruit BusIO@^1.17.0
