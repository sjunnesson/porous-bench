; Stage 3 + lvgl: Resident + drivers + LVGL 9 (luavgl) on the Waveshare ESP32 e-Paper Driver Board + 2.13"
; e-Paper (HINK-E0213A22 = V2, IL3897, 122x250 B/W). Wi-Fi via WiFiManager's
; captive portal, WebSocket to resident.inanimate.tech/devices/<id>, status on
; the panel; Lua modules screen, lgfx, lvgl, button, screens.
[env:epd213]
platform = espressif32@6.12.0
; ESP32-WROOM-32, 4 MB flash, no PSRAM, CP2102 bridge (DTR/RTS auto-reset).
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; Resident headers use std::optional (C++17); arduino-espressif32 6.12
; defaults to gnu++11.
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DMEM_PROBE
    ; Resident's lv_conf.h (from examples/m5stick-demo); lv_conf_internal.h
    ; stringifies LV_CONF_PATH itself, so no quotes.
    -DLV_CONF_PATH=${platformio.workspace_dir}/../lv_conf.h
    ; luavgl includes bare <lua.h>; Esp32Lua ships its headers in src/lua/.
    -I${platformio.workspace_dir}/libdeps/epd213/Esp32Lua/src/lua

; Resident + Lua + WiFiManager + TLS outgrow the default 1.25 MB app slot:
; 2.5 MB app + 1.4 MB SPIFFS.
board_build.partitions = partitions.csv

; Adafruit BusIO #includes SPI.h / Wire.h from headers the chain LDF misses.
lib_ldf_mode = deep
lib_deps =
    ; Resident 0.10.2, pinned to the commit this firmware was built and tested against.
    resident=https://github.com/inanimate-tech/resident.git#ecabf22e529ae6901e0916fa0e62f7703854c729
    ; The drivers are stage 3's (device/), with its defaults: this board's pins and panel.
    symlink://../device/lib/drivers
    git+https://github.com/inanimate-tech/courier.git
    tzapu/WiFiManager@^2.0.17
    bblanchon/ArduinoJson@^7.4.2
    ropg/ezTime@^0.8.3
    fischer-simon/Esp32Lua@^5.4.7
    adafruit/Adafruit GFX Library@^1.11.10
    ; screen.qr
    ricmoo/QRCode@^0.0.1
    ; LVGL pinned to the commit the luavgl fork's submodule tracks, as Resident's
    ; m5stick-demo does.
    lvgl=https://github.com/XuNeo/lvgl.git#d18e58d2f2dff763efadef5594ffb2b29d9102b6
    luavgl=https://github.com/inanimate-tech/luavgl.git#main
    ; Listed explicitly: with symlink:// deps in the list, LDF stops resolving BusIO on its own.
    adafruit/Adafruit BusIO@^1.17.0
