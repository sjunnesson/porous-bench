; Stage 1: bring-up, no Resident. Boots, prints chip info, draws a test card
; on the Waveshare ESP32-C6-LCD-1.47 (ST7789V3, 172x320 visible of a 240x320
; RAM, columns from 34) and times a full-frame push.
[env:c6-lcd147]
; The C6 needs Arduino core 3.x: pioarduino's platform, not espressif32@6.x.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
; esptool reads the chip as an ESP32-C6FH8 (rev v0.2): 8 MB of flash in the
; package, as the DevKitC-1 profile assumes. No PSRAM.

; Native USB (the C6's USB Serial/JTAG): without these, Serial stays silent.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_ldf_mode = deep
lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0
    adafruit/Adafruit GFX Library@^1.11.10
    adafruit/Adafruit BusIO@^1.17.0
