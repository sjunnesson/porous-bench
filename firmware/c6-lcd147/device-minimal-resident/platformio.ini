; Stage 2: Resident on the Waveshare ESP32-C6-LCD-1.47. Wi-Fi via WiFiManager's
; captive portal, WebSocket to resident.inanimate.tech/devices/<id>, status on
; the LCD. No hardware Lua modules yet.
[env:c6-lcd147]
; The C6 needs Arduino core 3.x: pioarduino's platform, not espressif32@6.x.
; Core 3.x already compiles C++ as gnu++2b, which covers Resident's C++17.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
; ESP32-C6FH8 (rev v0.2): 8 MB of flash in the package, as the DevKitC-1
; profile assumes. No PSRAM.
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
extra_scripts = pre:../core3.py

; Native USB (the C6's USB Serial/JTAG): without these, Serial stays silent.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_ldf_mode = deep
lib_deps =
    ; Resident 0.10.2, pinned to the commit this firmware was built against.
    ; It brings Courier 0.9.2 (Wi-Fi, WebSocket) from the registry.
    resident=https://github.com/inanimate-tech/resident.git#ecabf22e529ae6901e0916fa0e62f7703854c729
    ; Courier's WebSocket client. Core 2.x had it inside ESP-IDF; since IDF 5 it's
    ; a managed component, which core 3.x's prebuilt libraries leave out (its
    ; tcp_transport, http_parser and esp-tls are there). Espressif's registry
    ; archive, pinned.
    esp_websocket_client=https://components-file.espressif.com/components/espressif/esp_websocket_client/1.8.0/espressif__esp_websocket_client-v1.8.0.zip
    tzapu/WiFiManager@^2.0.17
    bblanchon/ArduinoJson@^7.4.2
    ropg/ezTime@^0.8.3
    fischer-simon/Esp32Lua@^5.4.7
    adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0
    adafruit/Adafruit GFX Library@^1.11.10
    adafruit/Adafruit BusIO@^1.17.0
